name: Full AniList backfill

# One-time (or top-up) walk of the whole AniList id space.
# You start it by hand: Actions -> Full AniList backfill -> Run workflow.
# It does NOT deploy and it does NOT commit. The catalog files are far too
# big for git (comics.json alone is 141 MB), so they live in the GitHub
# Actions cache instead. The deploy workflow reads them back from there.

on:
  workflow_dispatch:
    inputs:
      start_id:
        description: 'First AniList id (blank = carry on where it stopped)'
        required: false
        default: ''
      end_id:
        description: 'Last AniList id (blank = the highest live id)'
        required: false
        default: ''
      max_minutes:
        description: 'Stop cleanly after this many minutes'
        required: false
        default: '300'
      skip_seen:
        description: 'Skip ids already in data/seen.json (1 = yes)'
        required: false
        default: '0'
      fresh:
        description: 'Ignore the last build and keep only what this walk finds (1 = yes). Also lifts the shrink guard.'
        required: false
        default: '0'

permissions:
  contents: read

# Shared with deploy.yml and backfill-fields.yml: only one job may write the
# catalog at a time, or the last cache save silently drops the other's work.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      # The raw dump is large and is not committed, so it is cached between
      # runs. That lets a stopped walk carry on instead of starting again.
      - name: Restore the raw walk
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/seen.json
          key: anilist-raw-${{ github.run_id }}
          restore-keys: anilist-raw-

      # The built catalog also lives in the cache. Restoring it first means a
      # short top-up walk does not throw away what a long walk already found.
      - name: Restore the catalog
        uses: actions/cache/restore@v4
        with:
          path: |
            data/comics.json
            data/anime.json
            data/characters.json
          key: anilist-data-${{ github.run_id }}
          restore-keys: anilist-data-

      # Restored so the R2 snapshot pushed at the end still carries the
      # registry (this job never changes it).
      - name: Restore the slug registry
        uses: actions/cache/restore@v4
        with:
          path: data/slug-registry.json
          key: slug-registry-${{ github.run_id }}
          restore-keys: slug-registry-

      # Fills in only what the caches could not: a missing file, or a catalog
      # with fewer records than the R2 snapshot. Never makes anything smaller.
      - name: Fill gaps from the R2 snapshot
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
        run: node --max-old-space-size=6000 scripts/catalog-snapshot.mjs pull

      # No cache yet (first run, or the cache expired)? Start from the small
      # gzipped copy in data/seed rather than from nothing.
      - name: Fall back to the seed catalog
        run: bash scripts/unseed.sh

      - name: Walk AniList
        env:
          START_ID: ${{ github.event.inputs.start_id }}
          END_ID: ${{ github.event.inputs.end_id }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes }}
          SKIP_SEEN: ${{ github.event.inputs.skip_seen }}
          FRESH: ${{ github.event.inputs.fresh }}
          # A FRESH walk is meant to replace the catalog, so it may come out
          # smaller; the shrink guard in anilist-core.mjs would refuse it.
          ALLOW_SHRINK: ${{ github.event.inputs.fresh == '1' && '1' || '' }}
        run: node --max-old-space-size=6000 scripts/ingest-full.mjs

      # `if: always()` is the whole point. The walk costs hours. If any later
      # step fails, the work must still be saved. `save-always` on the older
      # combined cache action does NOT do this; only an explicit save step does.
      - name: Save the raw walk
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/seen.json
          key: anilist-raw-${{ github.run_id }}

      - name: Save the catalog
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/comics.json
            data/anime.json
            data/characters.json
          key: anilist-data-${{ github.run_id }}

      # The walk costs hours; keep a copy that does not expire. Refuses to
      # replace the snapshot with a smaller catalog unless ALLOW_SHRINK is set.
      - name: Save a snapshot to R2
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
          ALLOW_SHRINK: ${{ github.event.inputs.fresh == '1' && '1' || '' }}
        run: node --max-old-space-size=6000 scripts/catalog-snapshot.mjs push

      - name: What the walk found
        if: always()
        run: |
          ls -la data/*.json || true
          node -e "
            const fs = require('fs')
            for (const f of ['comics', 'anime', 'characters']) {
              const p = 'data/' + f + '.json'
              if (!fs.existsSync(p)) { console.log(f + ': missing'); continue }
              console.log(f + ': ' + JSON.parse(fs.readFileSync(p, 'utf8')).length)
            }
          "
