name: Backfill new AniList fields

# Run this by hand after adding a field to MEDIA_FIELDS in
# scripts/anilist-core.mjs: Actions -> Backfill new AniList fields -> Run.
#
# The daily ingest only refetches a title whose updatedAt moved, so a new field
# would otherwise never appear on the titles we already hold. This job asks
# AniList for all of them again, by id, and writes the catalog back to the
# cache. It takes a touch under two hours. It does NOT deploy; the next daily run
# picks the catalog up and rebuilds the site from it.

on:
  workflow_dispatch: {}

permissions:
  contents: read

# Shared with deploy.yml and backfill.yml: only one job may write the catalog
# at a time, or the last cache save silently drops the other's work.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  backfill-fields:
    runs-on: ubuntu-latest
    # The catalog is ~107,000 titles, not the ~7,000 first assumed: that is
    # 2,141 calls at about three seconds each, so a touch under two hours. The
    # first try was capped at 60 minutes and died two thirds of the way in with
    # nothing written, because the catalog is only saved once at the end.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Restore the catalog
        uses: actions/cache/restore@v4
        with:
          path: |
            data/comics.json
            data/anime.json
            data/characters.json
          key: anilist-data-${{ github.run_id }}
          restore-keys: anilist-data-

      # Restored so the R2 snapshot pushed at the end still carries the
      # registry (this job never changes it).
      - name: Restore the slug registry
        uses: actions/cache/restore@v4
        with:
          path: data/slug-registry.json
          key: slug-registry-${{ github.run_id }}
          restore-keys: slug-registry-

      # Fills in only what the caches could not: a missing file, or a catalog
      # with fewer records than the R2 snapshot. Never makes anything smaller.
      - name: Fill gaps from the R2 snapshot
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
        run: node --max-old-space-size=6000 scripts/catalog-snapshot.mjs pull

      - name: Fall back to the seed catalog
        run: bash scripts/unseed.sh

      - name: Refetch every known title
        run: node --max-old-space-size=6000 scripts/backfill-fields.mjs

      # The refetch costs API calls. Save even when a later step fails.
      - name: Save the catalog
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/comics.json
            data/anime.json
            data/characters.json
          key: anilist-data-${{ github.run_id }}

      # The refetch costs API calls; keep a copy that does not expire.
      - name: Save a snapshot to R2
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
        run: node --max-old-space-size=6000 scripts/catalog-snapshot.mjs push

      - name: What landed
        if: always()
        run: |
          node -e "
            const fs = require('fs')
            const comics = JSON.parse(fs.readFileSync('data/comics.json', 'utf8'))
            const count = (rows, test) => rows.filter(test).length
            console.log('comics: ' + comics.length)
            console.log('  with recs:    ' + count(comics, (c) => (c.recIds || []).length))
            console.log('  with ranks:   ' + count(comics, (c) => (c.ranks || []).length))
            console.log('  with readers: ' + count(comics, (c) => c.readers && Object.keys(c.readers).length))
            console.log('  with source:  ' + count(comics, (c) => c.source))
          "
