name: Build and deploy

on:
  push:
    branches: [master]
  schedule:
    # Every day at 02:00 UTC: pull fresh data, rebuild, redeploy.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Not `npm ci`: two copies of workerd live in the tree, and npm on
      # Windows cannot record the Linux binary of the second one in the
      # lock file. `npm install` resolves it on the runner instead.
      - run: npm install --no-audit --no-fund

      # The daily run only asks AniList what changed since yesterday and
      # fetches those records. A push deploy skips it and builds from the
      # data already in the repo. The one-time full backfill is a separate
      # workflow (backfill.yml), because it takes hours.
      # If AniList has a bad day, we still build and deploy from the data
      # already in the repo. A stale site beats a dead site.
      - name: Pull changed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node --max-old-space-size=6000 scripts/ingest-daily.mjs

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "manhwaindex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: daily data refresh [skip ci]"
          git push

      - run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 735d0fbab0757142b2c29917563e0626
